light:
  - platform: esp32_rmt_led_strip
    id: status_led_ring
    name: "Statuslicht"
    pin: GPIO21
    num_leds: 24
    chipset: WS2812
    rgb_order: GRB
    effects:
      # 1. Sanftes Atmen / Pulsieren
      - pulse:
          name: "Pulsieren"
          transition_length: 1.5s
          update_interval: 1.5s
          min_brightness: 20%
          max_brightness: 100%

      # 2. Umlaufender Regenbogen über alle 24 LEDs
      - addressable_rainbow:
          name: "Regenbogen"
          speed: 10
          width: 24

      # 3. Ring füllt sich LED für LED im Kreis
      - addressable_color_wipe:
          name: "Farb-Wischer"
          add_led_interval: 50ms

      # 4. Funkeln / Glitzern
      - addressable_twinkle:
          name: "Funkeln"
          twinkle_probability: 15%
          progress_interval: 30ms

      # 5. Eigene Animation: Rotierender Lade-Spinner mit Schweif
      - addressable_lambda:
          name: "Lade-Spinner"
          update_interval: 45ms
          lambda: |-
            static int pos = 0;
            it.all() = Color::BLACK;
            
            // Haupt-LED (100% Helligkeit der aktuell gewählten Farbe)
            it[pos % it.size()] = current_color;
            // Schweif dahinter abgedunkelt
            it[(pos + it.size() - 1) % it.size()] = current_color * 140;
            it[(pos + it.size() - 2) % it.size()] = current_color * 60;
            it[(pos + it.size() - 3) % it.size()] = current_color * 20;
            
            pos = (pos + 1) % it.size();