substitutions:
  device_name: "home-tonie"
  friendly_name: "Home Tonie"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESP32 + PN532 (SPI) für NFC-Tag-Erkennung"
  on_boot:
    priority: -100
    then:
      - logger.log: "Home Tonie gestartet"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Home Tonie Fallback"
    password: !secret wifi_ap_password

captive_portal:

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

pn532_spi:
  id: nfc_reader
  cs_pin: GPIO16
  update_interval: 250ms
  on_tag:
    then:
      - homeassistant.event:
          event: esphome.home_tonie_tag_scanned
          data:
            uid: !lambda 'return x;'
  on_tag_removed:
    then:
      - homeassistant.event:
          event: esphome.home_tonie_tag_removed
          data:
            uid: !lambda 'return x;'

