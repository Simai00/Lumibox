name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Versionen prüfen
        run: bash scripts/check-version.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Firmware bauen
        run: |
          pip install esphome==2026.10.0
          esphome compile esphome/lumibox.yaml

      - name: Artefakte und Manifest erzeugen
        env:
          VERSION_TAG: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          # Pfad unterscheidet sich je nach ESPHome-Version (build/ oder .pioenvs/<name>/).
          ota_bin="$(find esphome/.esphome/build/lumibox -name firmware.ota.bin | head -n1)"
          factory_bin="$(find esphome/.esphome/build/lumibox -name firmware.factory.bin | head -n1)"
          if [ -z "$ota_bin" ]; then echo "firmware.ota.bin nicht gefunden" >&2; exit 1; fi
          if [ -z "$factory_bin" ]; then echo "firmware.factory.bin nicht gefunden" >&2; exit 1; fi
          mkdir -p release site
          cp web/index.html site/index.html
          cp "$factory_bin" "release/lumibox-${version}.factory.bin"
          cp "$ota_bin" "release/lumibox-${version}.ota.bin"
          python3 scripts/make-ota-manifest.py "$ota_bin" "$version" site/firmware \
            --release-url "$RELEASE_URL"
          cat site/firmware/manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/*.bin
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*.bin

  deploy:
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
